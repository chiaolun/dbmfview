name = "dbmfview"
account_id = "4cd27ec0d809eb3b7cfeefe0e36ed22d"
main = "src/index.js"
compatibility_date = "2023-12-01"

# Uncomment to use a custom route
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

# Holdings snapshots: imgp:latest (cron-refreshed iMGP page parse) and
# dbmfwatch:latest / dbmfwatch:<date> (parsed from the emailed updates)
[[kv_namespaces]]
binding = "DBMF_KV"
id = "843053e8606e4bc789bb94b0c7ebe839"

# Refresh the iMGP holdings snapshot hourly; reruns are harmless (the
# stored payload only advances) and a failed fetch self-heals next hour
[triggers]
crons = ["0 * * * *"]

# Allocation-change alerts require Pushover credentials as secrets:
#   npx wrangler secret put PUSHOVER_TOKEN
#   npx wrangler secret put PUSHOVER_USER
# Without them the worker logs a warning and skips the alert.
[vars]
# Minimum weight move (decimal) that counts as a resize; rolls and
# opened/closed positions always alert regardless of this threshold
ALERT_WEIGHT_THRESHOLD = "0.01"
