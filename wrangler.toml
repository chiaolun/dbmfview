name = "dbmfview"
account_id = "4cd27ec0d809eb3b7cfeefe0e36ed22d"
main = "src/index.js"
compatibility_date = "2023-12-01"

# Uncomment to use a custom route
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

[[kv_namespaces]]
binding = "DBMF_KV"
id = "843053e8606e4bc789bb94b0c7ebe839"

# Refresh iMGP holdings shortly after the daily update (~11:40 UTC,
# observed via the dbmfwatch email), with an afternoon catch-up run
[triggers]
crons = ["15 12 * * *", "0 16 * * *"]

