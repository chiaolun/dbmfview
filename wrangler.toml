name = "dbmfview"
account_id = "4cd27ec0d809eb3b7cfeefe0e36ed22d"
main = "src/index.js"
compatibility_date = "2023-12-01"

# Uncomment to use a custom route
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

# Holdings snapshots: imgp:latest (cron-refreshed iMGP page parse) and
# dbmfwatch:latest / dbmfwatch:<date> (parsed from the emailed updates)
[[kv_namespaces]]
binding = "DBMF_KV"
id = "843053e8606e4bc789bb94b0c7ebe839"

# Refresh the iMGP holdings snapshot hourly; reruns are harmless (the
# stored payload only advances) and a failed fetch self-heals next hour
[triggers]
crons = ["0 * * * *"]

# Allocation-change alerts require Pushover credentials as secrets:
#   npx wrangler secret put PUSHOVER_TOKEN
#   npx wrangler secret put PUSHOVER_USER
# Without them the worker logs a warning and skips the alert.
[vars]
# Minimum risk change that counts as a resize, as a decimal fraction of NAV
# in annualized volatility terms (0.002 = 20bp of NAV vol). The change in
# shares-per-dollar-of-NAV is valued at the current price and scaled by the
# instrument's annualized vol: shares/NAV ignores price-driven weight drift
# and flow-driven share scaling so it only moves on actual trades, and the
# vol factor makes one threshold meaningful across instruments as different
# as 2-year notes and crude. Rolls and opened/closed positions always alert
# regardless of this threshold.
# Note: iMGP (exact shares and NAV, hourly) is the clean source and usually
# alerts first; dbmfwatch's ~2-significant-figure shares and estimated NAV
# can show ~25bp of apparent noise on the largest risk position, so raise
# this if those emails get chatty.
ALERT_RISK_THRESHOLD = "0.002"
